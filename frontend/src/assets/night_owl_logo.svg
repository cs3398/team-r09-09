<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="sky2" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#243B55"/>
      <stop offset="55%" stop-color="#101B33"/>
      <stop offset="100%" stop-color="#070C1A"/>
    </radialGradient>
    <linearGradient id="owlBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4B942"/>
      <stop offset="100%" stop-color="#D98A2B"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7E0"/>
      <stop offset="70%" stop-color="#F4B942"/>
      <stop offset="100%" stop-color="#D98A2B"/>
    </radialGradient>
    <radialGradient id="moonGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F5F1FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F5F1FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- EMBLEM -->
  <g transform="translate(20,20)">
    <circle cx="110" cy="110" r="110" fill="url(#sky2)"/>
    <circle cx="110" cy="110" r="106" fill="none" stroke="#3E5A7E" stroke-width="1" opacity="0.5"/>

    <!-- moon and glow behind the owl -->
    <circle cx="150" cy="58" r="30" fill="url(#moonGlow2)"/>
    <circle cx="150" cy="58" r="16" fill="#F5F1FF" opacity="0.85"/>

    <!-- stars -->
    <g fill="#EAF0FF">
      <circle cx="42" cy="46" r="1.4" opacity="0.8"/>
      <circle cx="176" cy="120" r="1.2" opacity="0.6"/>
      <circle cx="58" cy="170" r="1.3" opacity="0.7"/>
      <circle cx="30" cy="100" r="1" opacity="0.5"/>
    </g>

    <!-- owl silhouette, stylised: body + ear tufts + wing lines -->
    <g transform="translate(110,128)">
      <!-- ear tufts -->
      <path d="M-38 -46 C -34 -66, -18 -70, -10 -54 C -22 -58, -32 -52, -38 -46 Z" fill="#1B2436"/>
      <path d="M38 -46 C 34 -66, 18 -70, 10 -54 C 22 -58, 32 -52, 38 -46 Z" fill="#1B2436"/>

      <!-- body -->
      <path d="M0 -52 C 40 -52, 58 -20, 54 16 C 50 54, 26 76, 0 76 C -26 76, -50 54, -54 16 C -58 -20, -40 -52, 0 -52 Z"
            fill="#1B2436"/>

      <!-- facial disc -->
      <path d="M0 -30 C 26 -30, 40 -10, 38 12 C 36 34, 20 46, 0 46 C -20 46, -36 34, -38 12 C -40 -10, -26 -30, 0 -30 Z"
            fill="url(#owlBody)" opacity="0.18"/>

      <!-- eyes -->
      <circle cx="-16" cy="-4" r="13" fill="url(#eyeGlow)"/>
      <circle cx="16" cy="-4" r="13" fill="url(#eyeGlow)"/>
      <circle cx="-16" cy="-4" r="4.5" fill="#1B2436"/>
      <circle cx="16" cy="-4" r="4.5" fill="#1B2436"/>

      <!-- beak -->
      <path d="M-6 16 L6 16 L0 28 Z" fill="#E8862E"/>

      <!-- folded wing lines -->
      <path d="M-46 6 C -40 30, -30 52, -10 66" fill="none" stroke="#0F1626" stroke-width="3" opacity="0.6"/>
      <path d="M46 6 C 40 30, 30 52, 10 66" fill="none" stroke="#0F1626" stroke-width="3" opacity="0.6"/>
    </g>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(275,0)">
    <text x="0" y="118" font-size="58" font-style="italic" font-weight="400" letter-spacing="3" fill="#C9D6EE">night</text>
    <text x="0" y="188" font-size="80" font-weight="700" letter-spacing="1" fill="#F4B942">owl</text>
  </g>
</svg>
